openapi: 3.0.3
info:
  title: Kanban Board API
  description: |
    REST API для многопользовательской Kanban-доски с real-time синхронизацией.

    Все защищённые эндпоинты требуют **BearerAuth** (JWT, полученный через
    `/auth/register` или `/auth/login`).
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

paths:
  /health:
    get:
      summary: Проверка состояния сервиса и подключения к БД
      operationId: healthCheck
      responses:
        "200":
          description: Сервис работает нормально
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected

  /auth/register:
    post:
      summary: Регистрация нового пользователя (Этап 2)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: Вход в систему (Этап 2)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /boards:
    get:
      summary: Получить список досок текущего пользователя
      operationId: listBoards
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Список доступных досок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Создать новую доску
      operationId: createBoard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: Доска создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /boards/{boardId}:
    parameters:
      - $ref: "#/components/parameters/BoardIdParam"

    get:
      summary: Получить доску со всеми колонками и карточками
      operationId: getBoard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Полные данные доски
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Обновить доску (название)
      operationId: updateBoard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: Доска обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Удалить доску
      operationId: deleteBoard
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Доска успешно удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /boards/{boardId}/members:
    parameters:
      - $ref: "#/components/parameters/BoardIdParam"

    post:
      summary: Пригласить участника на доску
      operationId: inviteBoardMember
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        "200":
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /boards/{boardId}/columns:
    parameters:
      - $ref: "#/components/parameters/BoardIdParam"

    post:
      summary: Создать новую колонку на доске
      operationId: createColumn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateColumnRequest"
      responses:
        "201":
          description: Колонка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /columns/{columnId}:
    parameters:
      - $ref: "#/components/parameters/ColumnIdParam"

    patch:
      summary: Обновить колонку (название)
      operationId: updateColumn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColumnRequest"
      responses:
        "200":
          description: Колонка обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Удалить колонку
      operationId: deleteColumn
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Колонка удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /columns/{columnId}/move:
    parameters:
      - $ref: "#/components/parameters/ColumnIdParam"

    patch:
      summary: Переместить колонку (drag-n-drop внутри доски)
      description: |
        Вычисляет новый `order_num` согласно ADR 004 (среднее между `prev`
        и `next` под advisory lock'ом доски) — та же схема, что и
        `PATCH /cards/{cardId}/move`, колонки не переносятся между досками.
      operationId: moveColumn
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveColumnRequest"
      responses:
        "200":
          description: Колонка успешно перемещена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /columns/{columnId}/cards:
    parameters:
      - $ref: "#/components/parameters/ColumnIdParam"

    post:
      summary: Создать новую карточку в колонке
      operationId: createCard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
      responses:
        "201":
          description: Карточка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/CardIdParam"

    patch:
      summary: Обновить заголовок/описание карточки
      operationId: updateCard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
      responses:
        "200":
          description: Карточка обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Удалить карточку
      operationId: deleteCard
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Карточка удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cards/{cardId}/move:
    parameters:
      - $ref: "#/components/parameters/CardIdParam"

    patch:
      summary: Переместить карточку (drag-n-drop между колонками или внутри одной колонки)
      description: |
        Вычисляет новый `order_num` согласно ADR 004 (среднее между `prev` и `next` под advisory lock'ом колонки).
      operationId: moveCard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCardRequest"
      responses:
        "200":
          description: Карточка успешно перемещена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен, полученный через /auth/register или /auth/login

  parameters:
    BoardIdParam:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ColumnIdParam:
      name: columnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardIdParam:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректный запрос / ошибка валидации DTO
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Пользователь не аутентифицирован
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Недостаточно прав для выполнения операции
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "board not found"
        code:
          type: string
          example: "ERR_BOARD_NOT_FOUND"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "securePassword123"
        name:
          type: string
          example: "Константин"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: "securePassword123"

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        - id
        - email
        - name
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time

    BoardSummary:
      type: object
      required:
        - id
        - title
        - owner_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Проект Kanban Board"
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    Board:
      $ref: "#/components/schemas/BoardSummary"

    BoardDetail:
      type: object
      required:
        - id
        - title
        - owner_id
        - columns
        - members
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        owner_id:
          type: string
          format: uuid
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnDetail"
        members:
          type: array
          items:
            $ref: "#/components/schemas/BoardMember"
        created_at:
          type: string
          format: date-time

    CreateBoardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "Проект Kanban Board"

    UpdateBoardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: "Проект Kanban Board v2"

    BoardMember:
      type: object
      required:
        - user_id
        - email
        - name
        - joined_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        joined_at:
          type: string
          format: date-time

    Column:
      type: object
      required:
        - id
        - board_id
        - title
        - order_num
        - created_at
      properties:
        id:
          type: string
          format: uuid
        board_id:
          type: string
          format: uuid
        title:
          type: string
          example: "In Progress"
        order_num:
          type: number
          format: double
          example: 2000.0
        created_at:
          type: string
          format: date-time

    ColumnDetail:
      type: object
      required:
        - id
        - board_id
        - title
        - order_num
        - cards
        - created_at
      properties:
        id:
          type: string
          format: uuid
        board_id:
          type: string
          format: uuid
        title:
          type: string
        order_num:
          type: number
          format: double
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        created_at:
          type: string
          format: date-time

    CreateColumnRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
          example: "To Do"

    UpdateColumnRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1

    MoveColumnRequest:
      type: object
      properties:
        prev_column_id:
          type: string
          format: uuid
          nullable: true
          description: "ID колонки, СРАЗУ ПОСЛЕ которой вставляем (null, если вставляем в самое начало)"
        next_column_id:
          type: string
          format: uuid
          nullable: true
          description: "ID колонки, СРАЗУ ПЕРЕД которой вставляем (null, если вставляем в самый конец)"

    Card:
      type: object
      required:
        - id
        - column_id
        - title
        - order_num
        - author_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        column_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Настроить pgx connection pool"
        description:
          type: string
          example: "Добавить проверки в /health эндпоинт"
        order_num:
          type: number
          format: double
          example: 1500.0
        author_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CreateCardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Реализовать /health"
        description:
          type: string
          example: "Возвращает status ok"

    UpdateCardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string

    MoveCardRequest:
      type: object
      required:
        - target_column_id
      properties:
        target_column_id:
          type: string
          format: uuid
          description: "ID колонки назначение (может совпадать с текущей)"
        prev_card_id:
          type: string
          format: uuid
          nullable: true
          description: "ID карточки, СРАЗУ ПОСЛЕ которой вставляем (null, если вставляем в самый верх)"
        next_card_id:
          type: string
          format: uuid
          nullable: true
          description: "ID карточки, СРАЗУ ПЕРЕД которой вставляем (null, если вставляем в самый низ)"
